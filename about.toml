# cargo-about's settings, for THIRD-PARTY-LICENSES.html in the release archives.
# Same allow list as deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
# The four systems the release builds for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Only what is built into the program: not tests' crates, nor build tools.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Opalro's own crates are closed source and never published, so the allow list judges only
# the crates of others, and only theirs go in the notices.
private = { ignore = true }

# MPL-2.0 for option-ext alone, as in deny.toml.
[option-ext]
accepted = ["MPL-2.0"]

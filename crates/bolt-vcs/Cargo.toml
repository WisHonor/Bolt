[package]
name = "bolt-vcs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bolt"
path = "src/main.rs"

[features]
fault-injection = ["bolt-vcs-core/fault-injection"]

[dependencies]
bolt-vcs-core = { path = "../bolt-vcs-core" }
bolt-vcs-platform = { path = "../bolt-vcs-platform" }
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "filters"] }
tempfile = "3.27.0"

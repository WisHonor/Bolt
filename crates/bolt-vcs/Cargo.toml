[package]
name = "bolt-vcs"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[[bin]]
name = "bolt"
path = "src/main.rs"

[features]
fault-injection = ["bolt-vcs-core/fault-injection"]

[dependencies]
bolt-vcs-core = { path = "../bolt-vcs-core" }
anstyle-query = "1.1.5"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
serde_json = "1.0.154"
terminal_size = "0.4.4"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
blake3 = "1.8.7"
bolt-vcs-core = { path = "../bolt-vcs-core", features = ["test-support"] }
bolt-vcs-platform = { path = "../bolt-vcs-platform" }
insta = { version = "1.49.0", features = ["json", "filters"] }
proptest = "1.12.0"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"

[package]
name = "bolt-vcs-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "bolt_core"

[features]
fault-injection = []

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
getrandom = "0.4.3"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zstd = "0.14.3"

[dev-dependencies]
proptest = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      # 300 s per target nightly; 60 s on pushes so a run finishes quickly.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target
        run: |
          for t in decode_listing decode_save decode_diary decode_tag_list decode_server_lines open_pack name_rules format_file ignore_rules; do
            cargo +nightly fuzz run "$t" -- -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 || exit 1
          done
      - name: Upload crash files
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Imports Git's own repository, then compares every commit, tree, file and ref with Git. The
  # test prints how long the import took and its peak memory. Nightly and by hand, not on pushes.
  differential:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clone git/git with its whole history
        run: git clone --quiet --no-checkout https://github.com/git/git "$RUNNER_TEMP/git"
      - name: Import it and compare with Git
        shell: bash
        env:
          BOLT_DIFF_REPO: ${{ runner.temp }}/git
        run: |
          cargo test --release -p bolt-vcs --test import_vs_git -- --ignored --nocapture --exact a_real_repository_matches_git 2>&1 | tee differential.txt
          # A name that matches no test passes too, so the test must have run.
          grep -q "test result: ok. 1 passed" differential.txt

  # Evidence for the owner, not a gate (testing.md §3): Git for Windows writes the `/` in a link's
  # target as `\`, and this shows whether the first save after an import keeps the target Git
  # stored. GitHub's Windows runners can make links.
  windows-link-targets:
    name: Links Git for Windows writes keep their target when saved
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Save a link Git wrote
        shell: bash
        run: |
          cargo test -p bolt-vcs --test import_vs_git -- --ignored --nocapture --exact a_link_git_wrote_keeps_its_target_when_saved 2>&1 | tee links.txt
          grep -q "test result: ok. 1 passed" links.txt
          if grep -q "Skipped:" links.txt; then
            echo "Git couldn't make the link here, so this run shows nothing."
            exit 1
          fi

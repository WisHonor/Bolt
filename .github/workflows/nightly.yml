name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      # 300 s per target nightly; 60 s on pushes so a run finishes quickly.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target
        run: |
          for t in decode_listing decode_save decode_diary decode_tag_list decode_server_lines decode_project_link open_pack name_rules format_file ignore_rules git_loose git_pack git_delta git_objects git_refs git_config change_ids file_cache decode_journal decode_chunk_list cut_chunks; do
            cargo +nightly fuzz run "$t" -- -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 || exit 1
          done
      - name: Upload crash files
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Imports Git's own repository, then compares every commit, tree, file and ref with Git. The
  # test prints how long the import took and its peak memory. Nightly and by hand, not on pushes.
  differential:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clone git/git with its whole history
        run: git clone --quiet --no-checkout https://github.com/git/git "$RUNNER_TEMP/git"
      - name: Import it and compare with Git
        shell: bash
        env:
          BOLT_DIFF_REPO: ${{ runner.temp }}/git
        run: |
          cargo test --release -p bolt-vcs --test import_vs_git -- --ignored --nocapture --exact a_real_repository_matches_git 2>&1 | tee differential.txt
          # A name that matches no test passes too, so the test must have run.
          grep -q "test result: ok. 1 passed" differential.txt

  # Inflates zeros and sparse data of 110 to 300 MiB at three levels and checks every byte
  # (testing.md §3). Too slow for every push, so it is ignored there and runs here.
  inflate-sweep:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Inflate big, mostly-zero streams
        shell: bash
        run: |
          cargo test --release -p bolt-vcs-core --lib -- --ignored --exact git::odb::tests::big_mostly_zero_streams_inflate_whole 2>&1 | tee sweep.txt
          # A name that matches no test passes too, so the test must have run.
          grep -q "test result: ok. 1 passed" sweep.txt

  # A chunk list of the most chunks a list may hold, each one byte, written out as its 8 MiB
  # file. Too slow for every push, so it is ignored there and runs here.
  most-chunks:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Write out a list of 8,388,608 one-byte chunks
        shell: bash
        run: |
          cargo test --release -p bolt-vcs --test corpus_chunks -- --ignored --nocapture --exact a_list_of_the_most_chunks_a_list_may_hold_is_written_out_whole 2>&1 | tee chunks.txt
          # A name that matches no test passes too, so the test must have run.
          grep -q "test result: ok. 1 passed" chunks.txt

  # The model test of edits, saves, switches, shelves and undos (testing.md §3) with 1,024
  # cases, not the 64 of every push.
  model:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the model test with more cases
        shell: bash
        env:
          PROPTEST_CASES: "1024"
        run: |
          cargo test --release -p bolt-vcs --test model 2>&1 | tee model.txt
          grep -q "test result: ok. 1 passed" model.txt

  # Decision 023's gate: status on an unchanged 100,000-file project. The test prints the time;
  # the gate is checked against it before v0.1. Nightly and by hand, not on pushes.
  speed:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Time status on 100,000 files
        shell: bash
        run: |
          cargo test --release -p bolt-vcs --test speed -- --ignored --nocapture --exact status_on_an_unchanged_100_000_file_project 2>&1 | tee speed.txt
          # A name that matches no test passes too, so the test must have run.
          grep -q "test result: ok. 1 passed" speed.txt

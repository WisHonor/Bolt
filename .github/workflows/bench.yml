name: Bench

on:
  workflow_dispatch:
  push:
    # A redteam/<name>-sizes branch runs only rt4-1-sizes; other red-team branches start nothing.
    branches: ["bench/**", "redteam/*-sizes"]

permissions:
  contents: read

jobs:
  memory-gate:
    if: "!startsWith(github.ref, 'refs/heads/redteam/')"
    uses: ./.github/workflows/memory-gate.yml

  speed-gate:
    if: "!startsWith(github.ref, 'refs/heads/redteam/')"
    uses: ./.github/workflows/speed-gate.yml

  # Opalro, Git, and Git with Git LFS through the same steps on the same data, and the speeds of
  # the parts (bench/README.md). docs/benchmarks.md holds the results.
  against-git:
    if: "!startsWith(github.ref, 'refs/heads/redteam/')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      # The sets need up to about 25 GiB at once, while Git repacks 10 versions of a 1 GiB file.
      - name: Free disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Choose the folders
        run: |
          df -h
          data=$RUNNER_TEMP/bench results=$RUNNER_TEMP/results
          if [ "$RUNNER_OS" = Windows ]; then
            # Paths both Git's bash and Windows programs read. RUNNER_TEMP is on D:, which had the
            # more room in every run so far.
            results=$(cygpath -m "$RUNNER_TEMP")/results
            data=$(cygpath -m "$RUNNER_TEMP")/bench
          fi
          echo "BENCH_DATA=$data" >>"$GITHUB_ENV"
          echo "BENCH_RESULTS=$results" >>"$GITHUB_ENV"
          echo "Data in $data"
      - name: Describe the machine
        run: |
          echo "$ImageOS $ImageVersion"
          if [ "$RUNNER_OS" = Linux ]; then lscpu | grep -E '^(Model name|CPU\(s\)):'; free -h; fi
      - name: Describe the machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, TotalVisibleMemorySize
          Get-PhysicalDisk | Format-Table FriendlyName, MediaType, Size
          try { "Defender real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)" } catch { "Defender: not found" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install hyperfine
        run: cargo install --locked hyperfine --version 1.20.0
      - name: Build opal
        run: cargo build --release -p opal-vcs
      - name: Versions
        run: |
          echo "opal at $GITHUB_SHA"
          git --version && git lfs version && hyperfine --version && jq --version && openssl version
      - name: Fetch the code project and Godot's demos
        run: |
          bash bench/data.sh code "$BENCH_DATA/code"
          bash bench/data.sh godot "$BENCH_DATA/godot"
      - name: Speeds of the parts, and what compressing again would save
        run: |
          export OPAL_BENCH_CODE=$BENCH_DATA/code OPAL_BENCH_GODOT=$BENCH_DATA/godot
          cargo test --release -p opal-vcs-core --test throughput -- --ignored --nocapture --test-threads=1 2>&1 | tee throughput.txt
          # A name that matches no test passes too, so the tests must have run.
          grep -q "test result: ok. 2 passed" throughput.txt
      - name: Opalro, Git and Git LFS
        run: |
          export PATH="$PWD/target/release:$PATH"
          bash bench/run.sh sets "$BENCH_DATA" "$BENCH_RESULTS"
      - name: Results
        if: always()
        run: bash bench/run.sh summary "$BENCH_RESULTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ runner.os }}
          path: ${{ env.BENCH_RESULTS }}
          if-no-files-found: ignore

  # Imports git/git with main's opal and this commit's in turn, three times each on the same
  # machine, with each one's time and peak memory, and the first save after each import.
  import-git:
    if: "!startsWith(github.ref, 'refs/heads/redteam/')"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Describe the machine
        run: |
          echo "$ImageOS $ImageVersion"
          lscpu | grep -E '^(Model name|CPU\(s\)):'
          free -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          path: main-build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build both
        run: |
          cargo build --release -p opal-vcs
          cargo build --release -p opal-vcs --manifest-path main-build/Cargo.toml
          echo "main at $(git -C main-build rev-parse HEAD), this branch at $GITHUB_SHA"
      - name: Clone git/git with its whole history
        run: git clone --quiet https://github.com/git/git "$RUNNER_TEMP/git"
      - name: Import it with each opal in turn
        run: bash bench/run.sh import "$RUNNER_TEMP/git" "$PWD/main-build/target/release/opal" "$PWD/target/release/opal"

  # The red team's RT4-1 repository: 100 commits sharing a 1 MB message, each stored whole in Opalro
  # since records aren't chunked. Attack code, so it runs only on redteam/ branches. The test's
  # bound is expected to fail; the sizes are printed either way.
  rt4-1-sizes:
    if: startsWith(github.ref, 'refs/heads/redteam/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Import RT4-1's repository
        shell: bash
        run: |
          cargo test --release -p opal-vcs --test redteam4 -- --ignored --nocapture --exact rt4_1_a_small_history_without_merges_does_not_import_into_a_huge_opal 2>&1 | tee rt4.txt || true
          grep "RT4-1 sizes" rt4.txt

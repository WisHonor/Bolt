name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee -a test-output.txt; exit ${PIPESTATUS[0]}
      - name: cargo test
        shell: bash
        run: cargo test --workspace --all-features 2>&1 | tee -a test-output.txt; exit ${PIPESTATUS[0]}
      - name: Show failing tests as annotations
        if: failure()
        shell: bash
        run: |
          test -f test-output.txt || exit 0
          grep -A 12 -E "^---- .* stdout ----|^(error|warning)" test-output.txt | head -c 30000             | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1' | sed 's/^/::error title=test failures::/'
          echo

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

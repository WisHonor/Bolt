name: Speed gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    # A gate/ branch runs this job alone, to measure a change.
    branches: ["gate/**"]

permissions:
  contents: read

jobs:
  # On Git's source, Opalro's status and small save may take at most twice Git's time, and goto
  # three and a half times, twice being its goal for v0.2 (bench/README.md). The bench and nightly
  # workflows both call this job.
  speed-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Choose the folders
        run: |
          data=$RUNNER_TEMP/bench results=$RUNNER_TEMP/results
          if [ "$RUNNER_OS" = Windows ]; then
            # Paths both Git's bash and Windows programs read.
            results=$(cygpath -m "$RUNNER_TEMP")/results
            data=$(cygpath -m "$RUNNER_TEMP")/bench
          fi
          echo "BENCH_DATA=$data" >>"$GITHUB_ENV"
          echo "BENCH_RESULTS=$results" >>"$GITHUB_ENV"
          echo "Data in $data"
      - name: Describe the machine
        run: |
          echo "$ImageOS $ImageVersion"
          if [ "$RUNNER_OS" = Linux ]; then lscpu | grep -E '^(Model name|CPU\(s\)):'; free -h; fi
      - name: Describe the machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, TotalVisibleMemorySize
          Get-PhysicalDisk | Format-Table FriendlyName, MediaType, Size
          try { "Defender real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)" } catch { "Defender: not found" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install hyperfine
        run: cargo install --locked hyperfine --version 1.20.0
      - name: Build opalro
        run: cargo build --release -p opal-vcs
      - name: Versions
        run: |
          echo "opalro at $GITHUB_SHA"
          git --version && hyperfine --version && jq --version
      - name: Opalro against Git
        run: |
          export PATH="$PWD/target/release:$PATH"
          bash bench/run.sh gate "$BENCH_DATA" "$BENCH_RESULTS"
      - name: Results
        if: always()
        run: bash bench/run.sh summary "$BENCH_RESULTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-${{ runner.os }}
          path: ${{ env.BENCH_RESULTS }}
          if-no-files-found: ignore

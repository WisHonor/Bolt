[package]
name = "bolt-vcs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
# test-support for `Craft`, which writes the Git repositories the git_* targets read.
bolt-vcs-core = { path = "../crates/bolt-vcs-core", features = ["test-support"] }

# Not part of the main workspace, so `cargo test --workspace` and clippy never touch it.
[workspace]

[[bin]]
name = "decode_listing"
path = "fuzz_targets/decode_listing.rs"
test = false
doc = false
bench = false


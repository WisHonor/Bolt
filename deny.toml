[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Bolt's own crates are closed source and never published, so the allow list judges only
# the crates of others.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
]

# libFuzzer's sources, bundled in libfuzzer-sys, keep LLVM's old NCSA license. Only fuzz/ uses it.
[[licenses.exceptions]]
allow = ["NCSA"]
crate = "libfuzzer-sys"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

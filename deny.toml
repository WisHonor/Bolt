[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Opalro's own crates are closed source and never published, so the allow list judges only
# the crates of others.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]

# MPL-2.0 is allowed for option-ext alone, so a second MPL-2.0 crate needs a ruling. It asks
# that its text go with the program and people be told where its source is (both in the
# notices), that nothing limit their rights in that source, and that changes to its files be
# shared under MPL-2.0 (Opalro changes none). It works file by file: the rest of Opalro is untouched.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "option-ext"

# libFuzzer's sources, bundled in libfuzzer-sys, keep LLVM's old NCSA license. Only fuzz/ uses it.
[[licenses.exceptions]]
allow = ["NCSA"]
crate = "libfuzzer-sys"

[bans]
multiple-versions = "warn"
# Crates whose purpose is the network. Opalro sends nothing.
deny = [
    { crate = "reqwest", reason = "Opalro sends nothing (decision 142)" },
    { crate = "hyper", reason = "Opalro sends nothing (decision 142)" },
    { crate = "hyper-util", reason = "Opalro sends nothing (decision 142)" },
